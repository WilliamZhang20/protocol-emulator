# Tiny Tapeout project information
project:
  title:        "SRAM-Programmed Protocol Emulator"      # Project title
  author:       "William Zhang"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A spatial, reconfigurable tile fabric for bit-level hardware protocols"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # 20 ns target period in src/config.json

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Jane Street protocol-emulator competition allocation

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "protocol_emulator_core.v"
    - "px8_controller.v"
    - "fabric_timer.v"
    - "fabric_shifter.v"
    - "fabric_counter.v"
    - "fabric_crc.v"
    - "fabric_logic.v"
    - "byte_tile.v"
    - "config_bank.v"
    - "program_memory.v"
    - "byte_fifo.v"
    - "host_interface.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "host command[0]"
  ui[1]: "host command[1]"
  ui[2]: "host command[2]"
  ui[3]: "host command[3]"
  ui[4]: "host command[4]"
  ui[5]: "host command[5]"
  ui[6]: "host command[6]"
  ui[7]: "host command[7]"

  # Outputs
  uo[0]: "host response[0]"
  uo[1]: "host response[1]"
  uo[2]: "host response[2]"
  uo[3]: "host response[3]"
  uo[4]: "host response[4]"
  uo[5]: "host response[5]"
  uo[6]: "host response[6]"
  uo[7]: "host response[7]"

  # Bidirectional pins (protocol defaults; programs may remap any pin)
  uio[0]: "SPI CS"
  uio[1]: "UART TXD / SPI MOSI"
  uio[2]: "UART RXD / SPI MISO / I2C SCL"
  uio[3]: "SPI SCK / I2C SDA"
  uio[4]: "PS/2 CLK / USB D+"
  uio[5]: "PS/2 DATA / USB D-"
  uio[6]: "10BASE-T TD+"
  uio[7]: "10BASE-T TD-"

# Do not change!
yaml_version: 6
