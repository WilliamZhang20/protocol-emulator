# Tiny Tapeout project information
project:
  title:        "Programmable Protocol Fabric"      # Project title
  author:       "William Zhang"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Contexted mesh of coarse protocol tiles with two SRAM stream banks, programmed from source"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # 20 ns target period in src/config.json

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x4"          # 8x4 expansion (arch/spatial keeps the signed-off 6x4)

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "mesh_host.v"
    - "mesh_cfg.v"
    - "mesh_soc.v"
    - "mesh.v"
    - "ctx_switch.v"
    - "io_tile.v"
    - "wnet.v"
    - "grid_timer.v"
    - "fabric_shifter.v"
    - "fabric_crc.v"
    - "fabric_counter.v"
    - "config_bank.v"
    - "grid_stream_tiles.v"
    - "grid_stream_memory.v"
    - "memory_tiles.v"
    - "program_memory.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Host command data (stable through strobe)
  ui[0]: "host data[0]"
  ui[1]: "host data[1]"
  ui[2]: "host data[2]"
  ui[3]: "host data[3]"
  ui[4]: "host data[4]"
  ui[5]: "host data[5]"
  ui[6]: "host data[6]"
  ui[7]: "host data[7]"

  # Last SRAM read result
  uo[0]: "read data[0]"
  uo[1]: "read data[1]"
  uo[2]: "read data[2]"
  uo[3]: "read data[3]"
  uo[4]: "read data[4]"
  uo[5]: "read data[5]"
  uo[6]: "read data[6]"
  uo[7]: "read data[7]"

  # Protocol input and synchronous host command interface
  uio[0]: "protocol pad 0"
  uio[1]: "host strobe"
  uio[2]: "host command[0]"
  uio[3]: "host command[1]"
  uio[4]: "host command[2]"
  uio[5]: "protocol pad 1"
  uio[6]: "protocol pad 2"
  uio[7]: "protocol pad 3"

# Do not change!
yaml_version: 6
