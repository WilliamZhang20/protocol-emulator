name: tile experiment
on: [push, workflow_dispatch]

jobs:
  routing-and-spi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install simulation and synthesis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator yosys
      - name: Test and synthesize routing experiments
        run: make routing-experiment tile-spi-experiment ROUTING_YOSYS=yosys
      - name: Lint, test, and synthesize memory experiment
        run: make tile-memory-lint tile-memory-experiment tile-memory-assertion-mutation tile-memory-synth ROUTING_YOSYS=yosys
